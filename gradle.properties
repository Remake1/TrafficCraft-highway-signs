# Done to increase the memory available to Gradle.
org.gradle.jvmargs=-Xmx6G
org.gradle.daemon=false

# Mod properties
mod_version = 1.0.2
release_channel = beta
mod_id = tchighwaysigns
maven_group = dev.remake1.tchighwaysigns
archives_name = tchighwaysigns
enabled_platforms = fabric,neoforge

# Mod Info
display_name = TrafficCraft: Highway Signs
authors = Remake1
description = An addon for TrafficCraft that adds configurable multi-block highway signs with an in-game sign editor.
homepage = https://github.com/Remake1/TrafficCraft-highway-signs
issues = https://github.com/Remake1/TrafficCraft-highway-signs/issues
source = https://github.com/Remake1/TrafficCraft-highway-signs
license = GNU General Public License v3.0
java_version = 21

# Minecraft properties
minecraft_version = 1.21.1
parchment_version = 2024.11.17
next_unsupported_minecraft_version=1.21.2

## Modloader
fabric_loader_version = 0.16.14
fabric_api_version = 0.116.17+1.21.1
neoforge_version = 21.1.265
neoforge_loader_version = 4
neoforge_dependency_version = 21.1

## Base Dependencies
# Version bundled with TrafficCraft's DragonLib (both 2.x and 3.x for 1.21.1). Also the minimum version the addon requires.
architectury_api_version = 13.0.6
# Only used as a dev runtime dependency (TrafficCraft 1.2.0 needs it); the addon itself does not use DragonLib.
dragonlib_version = beta-3.0.28
forge_config_api_port_version = 21.1.1

## TrafficCraft (Modrinth maven version ids of 1.21.1-beta-1.2.0+3 (Fabric) and 1.21.1-beta-1.2.0+4 (NeoForge))
trafficcraft_version = 1.21.1-beta-1.2.0
trafficcraft_fabric_version = tCCRXk2K
trafficcraft_neoforge_version = ddJimXLT

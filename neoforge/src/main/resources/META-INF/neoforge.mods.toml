modLoader = "javafml"
loaderVersion = "[${neoforge_loader_version},)"
issueTrackerURL = "${issues}"
license = "${license}"

[[mods]]
modId = "${modid}"
version = "${version}"
displayName = "${display_name}"
displayURL = "${homepage}"
logoFile = "assets/tchighwaysigns/icon.png"
authors = "${authors}"
description = '''${description}'''

[[dependencies.${modid}]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_dependency_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${modid}]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraft_version},${next_unsupported_minecraft_version})"
ordering = "NONE"
side = "BOTH"

[[dependencies.${modid}]]
modId = "architectury"
type = "required"
versionRange = "[${architectury_api_version},)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${modid}]]
modId = "trafficcraft"
type = "required"
# Two ranges because NeoForge sorts "beta-1.2.0" (the version inside the 1.2.0 beta jars) below "1.1.3".
versionRange = "[${minecraft_version}-beta-1.2.0,${minecraft_version}-rc),[${minecraft_version}-1.1.3,)"
ordering = "AFTER"
side = "BOTH"

architectury {
    common rootProject.enabled_platforms.split(',')
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    modCompileOnly "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    modImplementation("dev.architectury:architectury-fabric:${rootProject.architectury_api_version}")
    modImplementation("com.electronwill.night-config:toml:3.6.0")
    // Provides NeoForge's config API (ModConfigSpec) on Fabric. On NeoForge the same classes are part of NeoForge itself.
    modImplementation("fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${rootProject.forge_config_api_port_version}")

    // TrafficCraft does not publish its common module, so common code compiles against the Fabric jar.
    modCompileOnly("maven.modrinth:trafficcraft:${rootProject.trafficcraft_fabric_version}")
}
